name: Build Desktop App

on:
  push:
    branches: [main, master]
    paths:
      - 'packages/desktop/**'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [main, master]

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Fix 7zip-bin permissions
        if: runner.os != 'Windows'
        run: |
          # Set execute permissions on 7za binaries (required for electron-builder)
          find . -path "*/7zip-bin/*/7za" -type f -exec chmod +x {} \;
        shell: bash

      - name: Build desktop app
        working-directory: packages/desktop
        run: |
          npm run build
          npx electron-builder --dir

      # Launch the PACKAGED app and assert it can write EXIF — the only check
      # that proves the asar-unpacked, per-OS ExifTool binary spawns at runtime.
      # The packaged Electron app needs Chromium's system libraries (libnss3,
      # libgbm1, libgtk-3-0, …) which aren't on the bare runner. playwright
      # install-deps apt-installs them; xvfb provides a display.
      - name: Install Linux runtime deps for the packaged app
        if: runner.os == 'Linux'
        working-directory: packages/desktop
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          npx playwright install-deps

      - name: Smoke-test packaged app (Linux)
        if: runner.os == 'Linux'
        working-directory: packages/desktop
        run: xvfb-run --auto-servernum npm run test:smoke

      - name: Smoke-test packaged app (macOS/Windows)
        if: runner.os != 'Linux'
        working-directory: packages/desktop
        run: npm run test:smoke
      # No artifact upload: the smoke test validates the build in-job, and CI
      # artifacts of the full unpacked app were exhausting the storage quota.
      # Release installers are published by release.yml on a version tag.
