name: Build Desktop App

on:
  push:
    branches: [main, master]
    paths:
      - 'packages/desktop/**'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [main, master]

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fix 7zip-bin permissions
        run: |
          if [ -f node_modules/7zip-bin/linux/x64/7za ]; then
            chmod +x node_modules/7zip-bin/linux/x64/7za
          fi
          if [ -f node_modules/7zip-bin/mac/x64/7za ]; then
            chmod +x node_modules/7zip-bin/mac/x64/7za
          fi
          if [ -f node_modules/7zip-bin/mac/arm64/7za ]; then
            chmod +x node_modules/7zip-bin/mac/arm64/7za
          fi
        shell: bash

      - name: Build desktop app
        working-directory: packages/desktop
        run: |
          npm run build
          npx electron-builder --dir

      - name: Upload build artifacts (for testing)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-build
          path: release/*
          retention-days: 7
