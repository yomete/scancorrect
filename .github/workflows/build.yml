name: Build Desktop App

on:
  push:
    branches: [main, master]
    paths:
      - 'packages/desktop/**'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [main, master]

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Debug 7zip-bin (before fix)
        run: |
          echo "Checking root node_modules/7zip-bin:"
          ls -laR node_modules/7zip-bin/ 2>/dev/null || echo "Not found in root"
          echo "Checking packages/desktop/node_modules/7zip-bin:"
          ls -laR packages/desktop/node_modules/7zip-bin/ 2>/dev/null || echo "Not found in desktop"
        shell: bash

      - name: Reinstall 7zip-bin to ensure binaries are present
        run: |
          npm install 7zip-bin@5.2.0 --no-save
          echo "After reinstall:"
          ls -laR node_modules/7zip-bin/ 2>/dev/null || echo "Still not found"
        shell: bash

      - name: Fix 7zip-bin permissions
        if: runner.os != 'Windows'
        run: |
          find . -path "*/7zip-bin/*/7za" -type f -exec chmod +x {} \; 2>/dev/null || true
        shell: bash

      - name: Build desktop app
        working-directory: packages/desktop
        run: |
          npm run build
          npx electron-builder --dir

      - name: Upload build artifacts (for testing)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-build
          path: release/*
          retention-days: 7
