name: Build Desktop App

on:
  push:
    branches: [main, master]
    paths:
      - 'packages/desktop/**'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [main, master]

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Fix 7zip-bin for monorepo
        run: |
          # Install 7zip-bin directly in desktop package to avoid hoisting issues
          cd packages/desktop
          npm install 7zip-bin@5.2.0 --no-save

          # Set execute permissions on all 7za binaries (macOS/Linux only)
          if [ "$RUNNER_OS" != "Windows" ]; then
            find . -path "*/7zip-bin/*/7za" -type f -exec chmod +x {} \;
            echo "7za binaries in packages/desktop:"
            find . -path "*/7zip-bin/*/7za" -type f -exec ls -la {} \;
          fi
        shell: bash

      - name: Build desktop app
        working-directory: packages/desktop
        run: |
          npm run build
          npx electron-builder --dir

      - name: Upload build artifacts (for testing)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-build
          path: release/*
          retention-days: 7
