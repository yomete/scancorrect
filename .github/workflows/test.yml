name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint desktop
        working-directory: packages/desktop
        run: npm run lint

      - name: Run unit tests
        working-directory: packages/desktop
        run: npm run test -- --reporter=verbose

      - name: Run tests with coverage
        working-directory: packages/desktop
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: packages/desktop/coverage/
          retention-days: 7

  e2e-tests:
    name: E2E Tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Linux requires xvfb for Electron
      - name: Install xvfb (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y xvfb

      - name: Install Playwright
        working-directory: packages/desktop
        run: npx playwright install --with-deps

      - name: Build app
        working-directory: packages/desktop
        run: npm run build

      # Run E2E tests with xvfb on Linux
      - name: Run E2E tests (Linux)
        if: runner.os == 'Linux'
        working-directory: packages/desktop
        run: xvfb-run --auto-servernum npm run test:e2e

      - name: Run E2E tests (macOS/Windows)
        if: runner.os != 'Linux'
        working-directory: packages/desktop
        run: npm run test:e2e

      # App screenshots captured by e2e/screenshots.test.ts (small PNGs — these
      # are the visual proof of the GUI on each OS, esp. Linux).
      - name: Upload app screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.os }}
          path: packages/desktop/screenshots/
          retention-days: 7
          if-no-files-found: ignore

      # Artifact storage is account-quota-limited; also emit the Linux
      # screenshots as base64 in the log so they can be retrieved regardless.
      - name: Echo screenshots (base64, Linux)
        if: always() && runner.os == 'Linux'
        working-directory: packages/desktop
        run: |
          for f in screenshots/*.png; do
            [ -f "$f" ] || continue
            echo "SCSHOT_BEGIN:$(basename "$f")"
            base64 -w0 "$f"; echo ""
            echo "SCSHOT_END"
          done

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.os }}
          path: packages/desktop/playwright-report/
          retention-days: 7

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ matrix.os }}
          path: packages/desktop/test-results/
          retention-days: 7

  integration-tests:
    name: Real-ExifTool Integration Tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Spawns the real per-OS ExifTool binary (no mocks). ubuntu/macos/windows
      # runners all ship Perl, which exiftool-vendored needs on non-Windows.
      - name: Run integration tests (real ExifTool binary)
        working-directory: packages/desktop
        run: npm run test:integration

  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript check
        run: npm run typecheck

  website:
    name: Website Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Build website
        run: npm run build --workspace website
