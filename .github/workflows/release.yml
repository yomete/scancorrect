name: Build and Release Desktop App

on:
  push:
    tags:
      - 'v*.*.*'  # Triggers on version tags like v1.0.0, v1.2.3, etc.

# The release job needs write access to create the GitHub Release + upload assets.
# (Default GITHUB_TOKEN is read-only, which 403s on release creation.)
permissions:
  contents: write

jobs:
  test:
    name: Test gate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Assert tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./packages/desktop/package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match packages/desktop/package.json version $PKG_VERSION"
            exit 1
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
        working-directory: packages/desktop
      - run: npm run test
        working-directory: packages/desktop

  build:
    needs: test
    name: Build & publish ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fix 7zip-bin permissions
        if: runner.os != 'Windows'
        run: |
          # Set execute permissions on 7za binaries (required for electron-builder)
          find . -path "*/7zip-bin/*/7za" -type f -exec chmod +x {} \;
        shell: bash

      # Decode signing cert + notarization API key from secrets into files, and
      # export the env vars electron-builder reads. If a secret is absent the
      # build simply stays unsigned / un-notarized (no empty-path "not a file").
      - name: Prepare macOS signing + notarization
        if: runner.os == 'macOS'
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -n "$MAC_CERT_P12_BASE64" ]; then
            echo "$MAC_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            echo "CSC_LINK=$RUNNER_TEMP/cert.p12" >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=$MAC_CERT_PASSWORD" >> "$GITHUB_ENV"
            echo "Code-signing cert configured."
          else
            echo "No MAC_CERT_P12_BASE64 secret — building unsigned."
          fi
          if [ -n "$APPLE_API_KEY_BASE64" ]; then
            mkdir -p "$RUNNER_TEMP/private_keys"
            echo "$APPLE_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/private_keys/AuthKey.p8"
            echo "APPLE_API_KEY=$RUNNER_TEMP/private_keys/AuthKey.p8" >> "$GITHUB_ENV"
            echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID" >> "$GITHUB_ENV"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER" >> "$GITHUB_ENV"
            echo "Notarization API key configured."
          else
            echo "No APPLE_API_KEY_BASE64 secret — skipping notarization."
          fi

      # electron-builder publishes to the GitHub release itself: this is the
      # only invocation mode where it reliably generates the latest*.yml
      # update manifests electron-updater needs (--publish never skips them —
      # verified empirically on the first v0.3.3 run). Each OS job appends its
      # own assets to the release for the tag.
      - name: Build and publish desktop app
        working-directory: packages/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run build
          npx electron-builder --publish always

      # electron-builder's output dir is ../../release relative to
      # packages/desktop (see build.directories.output) — i.e. release/ at the
      # REPO ROOT. This step must run there, not in packages/desktop.
      - name: Assert update manifest exists
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then f=release/latest-mac.yml; fi
          if [ "$RUNNER_OS" = "Windows" ]; then f=release/latest.yml; fi
          if [ "$RUNNER_OS" = "Linux" ]; then f=release/latest-linux.yml; fi
          if [ ! -f "$f" ]; then
            echo "::error::$f was not generated — auto-update would be broken. Failing release."
            exit 1
          fi
          cat "$f"
