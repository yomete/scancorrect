name: Build and Release Desktop App

on:
  push:
    tags:
      - 'v*.*.*'  # Triggers on version tags like v1.0.0, v1.2.3, etc.

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Debug 7zip-bin (before fix)
        run: |
          echo "Checking root node_modules/7zip-bin:"
          ls -laR node_modules/7zip-bin/ 2>/dev/null || echo "Not found in root"
          echo "Checking packages/desktop/node_modules/7zip-bin:"
          ls -laR packages/desktop/node_modules/7zip-bin/ 2>/dev/null || echo "Not found in desktop"
        shell: bash

      - name: Reinstall 7zip-bin to ensure binaries are present
        run: |
          npm install 7zip-bin@5.2.0 --no-save
          echo "After reinstall:"
          ls -laR node_modules/7zip-bin/ 2>/dev/null || echo "Still not found"
        shell: bash

      - name: Fix 7zip-bin permissions
        if: runner.os != 'Windows'
        run: |
          find . -path "*/7zip-bin/*/7za" -type f -exec chmod +x {} \; 2>/dev/null || true
        shell: bash

      - name: Build desktop app
        run: |
          npm run build -w desktop
          npm run dist -w desktop
        env:
          # Required for macOS code signing (optional, but recommended)
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          # Required for macOS notarization (optional)
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          # For Windows code signing (optional)
          WIN_CSC_LINK: ${{ secrets.WIN_CERT_P12_BASE64 }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-builds
          path: release/*
          retention-days: 5

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.zip
            artifacts/**/*.exe
            artifacts/**/*.AppImage
            artifacts/**/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
